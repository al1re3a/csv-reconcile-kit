[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-reconcile-kit"
version = "0.1.0"
description = "Reconcile CSV exports without hiding duplicate keys or decimal rounding differences."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
csv-reconcile-kit = "csv_reconcile_kit:main"

[tool.setuptools]
py-modules = ["csv_reconcile_kit"]
